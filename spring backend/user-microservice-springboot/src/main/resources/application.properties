# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=user-microservice

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
# ============================================
# POSTGRESQL DATABASE CONFIGURATION
# ============================================

spring.datasource.url=jdbc:postgresql://localhost:5432/week2
spring.datasource.username=postgres
spring.datasource.password=welcome2307*
spring.datasource.driver-class-name=org.postgresql.Driver
# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
# Create/update tables automatically
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (for debugging)
spring.jpa.show-sql=true

# PostgreSQL dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Format SQL queries (makes them readable)
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# REDIS CACHE CONFIGURATION
# ============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# ============================================
# JWT CONFIGURATION
# ============================================
# IMPORTANT: Change this secret in production!
jwt.secret=your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm-security
jwt.expiration=86400000

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ============================================
# LOGGING CONFIGURATION
# ============================================
logging.level.root=INFO
logging.level.com.microservice.user=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# CORS CONFIGURATION
# ============================================
spring.web.cors.allowed-origins="*"
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ============================================
# ACTUATOR (HEALTH CHECK) CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
